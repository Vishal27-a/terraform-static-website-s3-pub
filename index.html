<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flipkart GoShare Clone</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f1f3f6;
    transition: 0.3s;
}

.dark {
    background: #121212;
    color: white;
}

header {
    background: #2874f0;
    color: white;
    padding: 15px;
    text-align: center;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    padding: 10px;
    background: white;
}

.dark .top-bar {
    background: #1e1e1e;
}

input {
    padding: 8px;
    width: 40%;
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.card {
    background: white;
    width: 250px;
    margin: 15px;
    border-radius: 10px;
    overflow: hidden;
    transition: 0.3s;
}

.dark .card {
    background: #1e1e1e;
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

.card-body {
    padding: 10px;
}

button {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: none;
    cursor: pointer;
}

.cart-btn { background: orange; color: white; }
.wish-btn { background: pink; }
</style>

</head>
<body>

<header>
    Flipkart GoShare Clone
</header>

<div class="top-bar">
    🔍 <input type="text" id="search" placeholder="Search product..." onkeyup="searchProduct()">
    
    <div>
        🛒 Cart: <span id="cart-count">0</span> | ₹<span id="total">0</span>
        <button onclick="toggleDark()">🌙</button>
    </div>
</div>

<div class="container" id="products">

    <!-- Product -->
    <div class="card">
        <img src="https://images.unsplash.com/photo-1518444065439-e933c06ce9cd">
        <div class="card-body">
            <h4>Headphones</h4>
            <p>₹999</p>
            <button class="cart-btn" onclick="addCart(999)">Add to Cart</button>
            <button class="wish-btn" onclick="wishlist()">❤️ Wishlist</button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1511732351155-1865efcb7b7b">
        <div class="card-body">
            <h4>Smart Watch</h4>
            <p>₹1499</p>
            <button class="cart-btn" onclick="addCart(1499)">Add to Cart</button>
            <button class="wish-btn" onclick="wishlist()">❤️ Wishlist</button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad">
        <div class="card-body">
            <h4>Speaker</h4>
            <p>₹799</p>
            <button class="cart-btn" onclick="addCart(799)">Add to Cart</button>
            <button class="wish-btn" onclick="wishlist()">❤️ Wishlist</button>
        </div>
    </div>

</div>

<script>
let count = 0;
let total = 0;

// Cart function
function addCart(price) {
    count++;
    total += price;

    document.getElementById("cart-count").innerText = count;
    document.getElementById("total").innerText = total;
}

// Wishlist
function wishlist() {
    alert("Added to Wishlist ❤️");
}

// Search
function searchProduct() {
    let input = document.getElementById("search").value.toLowerCase();
    let cards = document.getElementsByClassName("card");

    for (let i = 0; i < cards.length; i++) {
        let title = cards[i].innerText.toLowerCase();
        cards[i].style.display = title.includes(input) ? "block" : "none";
    }
}

// Dark mode
function toggleDark() {
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
